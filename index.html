",""]]},{"n":"常见沉淀及其颜色","type":"ppt","rows":[["AgCl","白色↓，不溶于稀 HNO₃","用于检验 Cl⁻",""],["BaSO₄","白色↓，不溶于酸","用于检验 SO₄²⁻ 与 X 射线造影剂",""],["CaCO₃ / BaCO₃","白色↓，溶于稀强酸并放 CO₂","CaCO₃ 可溶于醋酸（食醋除水垢）",""],["Mg(OH)₂","白色↓，溶于铵盐溶液","可中和胃酸",""],["Al(OH)₃","白色胶状↓，两性，溶于强酸与强碱","不溶于过量氨水",""],["Zn(OH)₂","白色↓，两性，溶于强碱与氨水","与 Al(OH)₃ 区别在氨水溶解性",""],["Fe(OH)₂","白色↓→灰绿色→红褐色","空气中被氧化为 Fe(OH)₃，制备需隔绝空气",""],["Fe(OH)₃","红褐色↓","用于检验 Fe³⁺",""],["Cu(OH)₂","蓝色↓，受热分解为 CuO（黑）","可溶于葡萄糖碱性溶液加热生成 Cu₂O 砖红色",""],["Cu₂O","砖红色","检验醛基（银镜反应或新制 Cu(OH)₂）的产物",""],["AgBr / AgI","淡黄色↓ / 黄色↓","均不溶于稀 HNO₃，分别检验 Br⁻ 与 I⁻",""],["PbS / CuS / Ag₂S","黑色↓","硫化物多带色，难溶于酸",""],["CdS / As₂S₃","黄色↓","硫化物特征颜色",""],["Sb₂S₃","橙色↓","硫化物特征颜色",""],["MnS","肉色（粉红）↓","可溶于稀酸",""],["BaCrO₄","黄色↓","用于检验 CrO₄²⁻ 或 Ba²⁺",""],["Ca₃(PO₄)₂","白色↓，不溶于水","磷肥主要成分",""],["MnO₂","黑色固体（不是沉淀）","催化 KClO₃ 分解，制 Cl₂ 的氧化剂",""],["Cu / Ag / Au","红色/银白/黄色金属","活泼性弱的金属可被置换析出",""]]},{"n":"离子检验方法","type":"test","rows":[["H⁺ 检验","石蕊变红、甲基橙变红、pH < 7","活泼金属放 H₂、碳酸盐放 CO₂",""],["OH⁻ 检验","石蕊变蓝、酚酞变红","与 Cu²⁺ 生成蓝色沉淀，与 Fe³⁺ 生成红褐色沉淀",""],["Cl⁻ 检验","先加稀 HNO₃ 酸化，再加 AgNO₃ 生成白色↓","先酸化排除 CO₃²⁻ 等干扰",""],["Br⁻ / I⁻ 检验","AgNO₃ + 稀 HNO₃：淡黄↓ / 黄↓","I⁻ 还可被 Cl₂ 氧化为 I₂ 使淀粉变蓝",""],["SO₄²⁻ 检验","先加稀 HCl 酸化，再加 BaCl₂ 生成白色↓","酸化排除 CO₃²⁻、SO₃²⁻、Ag⁺ 干扰",""],["SO₃²⁻ 检验","加稀强酸放出 SO₂，使品红褪色（加热复原）","SO₂ 漂白可逆，Cl₂、O₃ 漂白不可逆",""],["CO₃²⁻ 检验","加稀强酸放 CO₂，使澄清石灰水变浑浊","注意 SO₃²⁻ 也放气体，需结合品红检验",""],["NH₄⁺ 检验","加浓 NaOH 加热，放出使湿润红色石蕊变蓝的 NH₃","有刺激性气味",""],["Fe³⁺ 检验","KSCN 变血红色 / 加 NaOH 生成红褐色↓","苯酚显紫色，亚铁氰化钾生成蓝色沉淀",""],["Fe²⁺ 检验","先加 KSCN 不变红，再加氯水变红","或加 NaOH 出现白色→灰绿→红褐色变化",""],["Cu²⁺ 检验","溶液蓝色，加 NaOH 生成蓝色↓，加热转黑色 CuO","浓 CuCl₂ 溶液呈绿色",""],["Ba²⁺ 检验","稀硫酸或可溶性硫酸盐生成白色不溶↓","焰色反应呈黄绿色",""],["Na⁺ / K⁺ 检验","焰色反应：Na 黄色、K 浅紫色","观察 K 需透过蓝色钴玻璃滤去钠黄光",""],["Al³⁺ 检验","适量 NaOH 生成白色↓，过量 NaOH 溶解；加氨水生成白色↓不溶","与 Zn²⁺ 区别在氨水中是否溶解",""]]},{"n":"概念与理论","type":"all","rows":[["电解质","在水溶液中或熔融状态下能导电的化合物","NaCl、HCl、NaOH"],["非电解质","在上述两种情况下都不能导电的化合物","蔗糖、乙醇、CH₄"],["强电解质","完全电离","强酸、强碱、绝大多数盐"],["弱电解质","部分电离，存在电离平衡","弱酸（CH₃COOH、HF）、弱碱（NH₃·H₂O）"],["电离方程式","表示电解质电离过程","CH₃COOH⇌CH₃COO⁻+H⁺"],["电离度","已电离的分子数/总分子数","弱电解质特征"],["水的离子积","Kw=[H⁺][OH⁻]=1×10⁻¹⁴（25℃）","中性时 [H⁺]=[OH⁻]=10⁻⁷"],["pH","pH=-lg[H⁺]","pH<7 酸性，pH>7 碱性"],["缓冲溶液","能抵抗少量酸碱、保持 pH 基本不变","CH₃COOH/CH₃COONa"],["盐类水解","弱酸根或弱碱阳离子与水电离的 H⁺/OH⁻ 结合","Na₂CO₃ 溶液显碱性"],["完全双水解","弱酸根与弱碱阳离子同时水解，进行到底","Al³⁺+3HCO₃⁻=Al(OH)₃↓+3CO₂↑"],["水解常数","Kh=Kw/Ka 或 Kw/Kb","衡量水解程度"],["电荷守恒","溶液中阳离子所带正电荷总量=阴离子负电荷总量","溶液电中性"],["物料守恒","某一组分的原始浓度=其在各形态中的浓度之和","元素守恒"],["质子守恒","得质子总数=失质子总数","酸碱平衡"]]}],"notes":[["离子检验必须排除干扰","检验 Cl⁻ 先加稀 HNO₃ 排除 CO₃²⁻；检验 SO₄²⁻ 先加稀 HCl 排除 CO₃²⁻、SO₃²⁻、Ag⁺；检验 SO₃²⁻ 用酸化的 KMnO₄ 会干扰。"],["沉淀颜色是推断题的突破口","记住白（AgCl、BaSO₄、CaCO₃、Al(OH)₃）、蓝（Cu(OH)₂）、红褐（Fe(OH)₃）、红棕（Fe₂O₃）、黑（CuO、MnO₂、Fe₃O₄、CuS）、黄（AgI、BaCrO₄、CdS）、淡黄（AgBr）。"]]},"act":{"title":"金属活动性顺序、焰色与冶炼","intro":"金属活动性顺序反映金属在水溶液中失电子能力的强弱，决定其与水、酸、盐的反应能力，也是冶炼方法选择的依据。","groups":[{"n":"金属活动性顺序","type":"seq","rows":[["K Ca Na Mg Al Zn Fe Sn Pb (H) Cu Hg Ag Pt Au","由强到弱","排在 H 前的金属能置换非氧化性酸中的 H；前面的金属能把后面的金属从其盐溶液中置换出来","K、Ca、Na 太活泼，不能从盐溶液中置换出后面的金属"],["K、Ca、Na 与水的反应","2Na + 2H₂O = 2NaOH + H₂↑","Na 浮在水面熔成小球、四处游动；K 更剧烈；Ca 与冷水反应较慢","Na 投入 CuSO₄ 溶液生成 Cu(OH)₂ 而非置换出 Cu"],["Al 的特性","铝在空气与水中表面生成致密 Al₂O₃ 膜","常温下 Al 遇浓硫酸、浓硝酸钝化；Al₂O₃、Al(OH)₃ 均为两性",""],["Zn 与酸、碱的反应","Zn + 2HCl = ZnCl₂ + H₂↑","Zn 既能与酸也能与强碱反应放 H₂：Zn + 2NaOH + 2H₂O = Na₂[Zn(OH)₄] + H₂↑","Zn 是两性金属"],["Fe 的置换规律","Fe 与非氧化性酸或盐溶液反应只生成 Fe²⁺","Fe + CuSO₄ = FeSO₄ + Cu；Fe + H₂SO₄(稀) = FeSO₄ + H₂↑","生成 Fe³⁺ 必须是 Fe 被强氧化剂氧化"],["Cu、Hg、Ag 与氧族反应","Cu + 2AgNO₃ = Cu(NO₃)₂ + 2Ag","Cu 能置换 Ag，但 Ag 不能置换 Cu",""],["Cu 与氧化性酸","Cu + 4HNO₃(浓) = Cu(NO₃)₂ + 2NO₂↑ + 2H₂O","Cu 与稀 HNO₃ 生成 NO；与热浓 H₂SO₄ 生成 SO₂","均不放出 H₂"],["Au、Pt 的惰性","不与非氧化性酸反应，溶于王水","王水 = 浓 HNO₃ : 浓 HCl = 1 : 3（体积比）",""],["金属活动性的意义","决定原电池正负极、电解池阳离子放电顺序、冶炼方法、腐蚀速率","越活泼越易被腐蚀，也越难还原",""],["金属性与非金属性","同周期从左到右金属性减弱、非金属性增强；同族从上到下金属性增强、非金属性减弱","金属性看气态原子失电子难易；非金属性看得电子难易","金属性≠金属活动性：后者是水溶液中的实际能力"],["金属性判断依据","与水/酸反应的剧烈程度、最高价氧化物对应水化物的碱性强弱","碱性：NaOH > Mg(OH)₂ > Al(OH)₃ 说明金属性 Na > Mg > Al",""],["非金属性判断依据","与 H₂ 化合难易与氢化物稳定性、最高价氧化物对应水化物的酸性强弱","酸性：HClO₄ > H₂SO₄ > H₃P :"重要化学方程式","intro":"书写方程式要遵循质量守恒（配平）、客观事实、标注反应条件与气体↑/沉淀↓符号。离子方程式只保留实际参与反应的离子。","groups":[{"n":"实验室制气体","type":"lab","rows":[["实验室制 O₂（KClO₃ 分解）","2KClO₃ —MnO₂/Δ→ 2KCl + 3O₂↑","MnO₂ 是催化剂，反应前后质量与化学性质不变",""],["实验室制 O₂（KMnO₄ 分解）","2KMnO₄ —Δ→ K₂MnO₄ + MnO₂ + O₂↑","试管口略向下倾斜，导管口塞棉花防粉末堵塞",""],["实验室制 O₂（H₂O₂ 分解）","2H₂O₂ —MnO₂→ 2H₂O + O₂↑","常温反应，适合固液不加热装置",""],["实验室制 H₂","Zn + H₂SO₄(稀) = ZnSO₄ + H₂↑","用 Zn 与稀硫酸，不能用浓 H₂SO₄ 或 HNO₃","不能用 Cu 等不活泼金属"],["实验室制 CO₂","CaCO₃ + 2HCl = CaCl₂ + H₂O + CO₂↑","用大理石与稀盐酸，不能用硫酸（CaSO₄ 覆盖表面阻止反应）",""],["实验室制 Cl₂","MnO₂ + 4HCl(浓) —Δ→ MnCl₂ + Cl₂↑ + 2H₂O","也可用 KMnO₄ 与浓 HCl 常温反应，不需加热","尾气用 NaOH 溶液吸收 Cl₂"],["实验室制 HCl","NaCl + H₂SO₄(浓) —微热→ NaHSO₄ + HCl↑","高沸点酸制低沸点酸，难挥发性酸制挥发性酸",""],["实验室制 HNO₃","NaNO₃ + H₂SO₄(浓) —Δ→ NaHSO₄ + HNO₃↑","同理，生成的 HNO₃ 被冷凝收集",""],["实验室制 SO₂","Na₂SO₃ + H₂SO₄(浓) = Na₂SO₄ + H₂O + SO₂↑","强酸制弱酸（或挥发性酸）",""],["实验室制 H₂S","FeS + H₂SO₄(稀) = FeSO₄ + H₂S↑","不能用强氧化性酸（会被氧化）",""],["实验室制 NH₃","Ca(OH)₂ + 2NH₄Cl —Δ→ CaCl₂ + 2NH₃↑ + 2H₂O","向下排空气法收集（密度小于空气）","不能用无水 CaCl₂ 干燥（形成 CaCl₂·8NH₃）"],["实验室制 CH₄","CH₃COONa + NaOH —CaO/Δ→ Na₂CO₃ + CH₄↑","无水醋酸钠与碱石灰共热脱羧",""],["实验室制 C₂H₄","CH₃CH₂OH —浓H₂SO₄/170℃→ CH₂=CH₂↑ + H₂O","浓 H₂SO₄ 作催化剂与脱水剂，需加碎瓷片防暴沸","170℃ 生成乙烯，140℃ 生成乙醚"],["实验室制 C₂H₂","CaC₂ + 2H₂O → Ca(OH)₂ + C₂H₂↑","反应剧烈放热，用饱和食盐水代替水减缓速率",""]]},{"n":"四种基本反应类型","type":"rx","rows":[["化合反应","A + B → AB","两种或以上物质生成一种物质的反应；如 2H₂ + O₂ → 2H₂O、CaO + H₂O = Ca(OH)₂","与分解反应互为逆过程"],["分解反应","AB → A + B","一种物质生成两种或以上物质的反应；如 2KClO₃ → 2KCl + 3O₂↑、CaCO₃ → CaO + CO₂↑","与化合反应互为逆过程"],["置换反应","A + BC → AC + B","单质与化合物反应生成新单质与新化合物；如 Fe + CuSO₄ = FeSO₄ + Cu、Zn + H₂SO₄ = ZnSO₄ + H₂↑","铁置换只生成 Fe²⁺；K/Ca/Na 太活泼不能从盐溶液置换"],["复分解反应","AB + CD → AD + CB","两种化合物互相交换成分生成另两种化合物；如 NaCl + AgNO₃ = AgCl↓ + NaNO₃","条件：生成沉淀/气体/水；中和反应是其特例"],["氧化反应","物质得到氧（或失去电子）","如 C + O₂ → CO₂、2Mg + O₂ → 2MgO；还原剂被氧化","与还原反应同时发生"],["还原反应","物质失去氧（或得到电子）","如 CuO + H₂ → Cu + H₂O；氧化剂被还原","与氧化反应同时发生"],["中和反应","酸 + 碱 → 盐 + 水","复分解反应的特殊类型；实质 H⁺ + OH⁻ = H₂O","反应放热，生成物一定是盐和水"],["水解反应","化合物与水反应分解","如酯、油脂、糖、蛋白质、盐类均可水解","弱酸           if (ci < nameChars.length - 2) nameTokens.push(nameChars.substr(ci, 3));

        var restChars = norm((parts.slice(2) || []).join(""));

        for (var ri = 0; ri < restChars.length; ri++) {
          restTokens.push(restChars.charAt(ri));
          if (ri < restChars.length - 1) restTokens.push(restChars.substr(ri, 2));

          name: name, fm: fm, rest: rest,
          blob: (name + " " + fm + " " + rest),

}

// ===== 分词（增强版：中文化学式粘连拆词 + 中文子串） =====
function tokenize(q) {
  q = norm(q).replace(/[，；;。？?、,.·\s]+/g, " ").trim();
  if (!q) return [];
  // 中文别名映射：将中文化学名称转为化学式符号
  // 按别名长度从长到短排序，避免短别名先匹配导致长别名被破坏
  var aliasKeys = [];
  for (var ak in ALIAS_MAP) aliasKeys.push(ak);
  aliasKeys.sort(function (a, b) { return b.length - a.length; });
  // 使用占位符避免重复替换
  var placeholders = {};
  var phIdx = 0;
  for (var ai = 0; ai < aliasKeys.length; ai++) {
    var key = aliasKeys[ai];
    if (q.indexOf(key) >= 0) {

  var merged = [];
  for (var j = 0; j < out.length; j++) {
    var tk = out[j];
    // 价态写法归一："+2"/"＋2"/"正2" → "2"
    var vm = /^[+\-＋－]?(\d+)价?$/.exec(tk);
    if (vm) { merged.push(vm[1]); continue; }

    if (/^[a-z][a-z0-9]*$/.test(tk) && /[0-9]/.test(tk)) {
      merged.push(tk);
      var head = tk.charAt(0);
      var cap = tk.charAt(1);
      if (cap >= "a" && cap <= "z") {
        var p = 1;
        while (p < tk.length && tk.charAt(p) >= "a" && tk.charAt(p) <= "z") p++;
        merged.push(tk.slice(0, p));
        var q2 = tk.slice(p).replace(/[0-9]+/g, "");
        if (q2) merged.push(q2);
      } else {
        merged.push(head);
      }
    } else {
      merged.push(tk);
    }
  }
  // 去重保序
  var uniq = [];
  var seen = {};
  for (var k = 0; k < merged.length; k++) {
    if (seen[merged[k]]) continue;
    seen[merged[k]] = 1;
    uniq.push(merged[k]);
  }
  return uniq;
}

// 价态字符串是否出现在文本中（要求后面紧跟非数字字符或结尾）
function valHit(val, text) {
  var i = 0;
  while (i < text.length) {
    var p = text.indexOf(val, i);
    if (p < 0) break;
    var nxt = text.charAt(p + val.length);
    if (!nxt || nxt === " " || nxt === "价" || nxt === "、" || nxt === "，" || nxt === "（" || nxt === "(" || nxt === ")" || nxt === "。" || nxt === "；" || nxt === "／" || nxt === "/" || nxt === "与" || nxt === "和" || nxt === "，" || nxt === "等") return true;
    i = p + 1;
  }

}

// 中文子串匹配（连续子串）
function cnSubstr(haystack, needle) {
  if (!needle) return false;
  return haystack.indexOf(needle) >= 0;
}

// 单条评分（增强版：中文模糊匹配 + 化学式精确匹配）
function scoreItem(it, tokens) {
  var name = it.name, fm = it.fm, rest = it.rest, blob = it.blob;
  var parts = [];
  for (var c = 0; c < it.row.length; c++) if (it.row[c] != null && String(it.row[c]).length) parts.push(String(it.row[c]));
  var rawName = norm(parts[0] || ""), rawFm = norm(parts[1] || ""), rawRest = norm((parts.slice(2) || []).join(" "));
  var fmDigits = stripDigits(fm);
  var fmLetters = stripAll(fm);
  var nameLetters = stripAll(name);
  var best = -1;
  for (var k = 0; k < tokens.length; k++) {
    var tk = tokens[k];
    if (!tk) return -1;
    var tkDigits = stripDigits(tk);
    var tkLetters = stripAll(tk);
    var sc = -1;

    // ① 化学式完全归一（去下标数字后一致）：Fe2O3 ≡ Fe₂O₃
    if (tkDigits && fmDigits && tkDigits === fmDigits) sc = Math.max(sc, 9900000 + (10 - k) * 100);

    // ①b 中文别名精确匹配：检查原始名称是否包含查询词（用于 氮气→氮N 等）
    var rawName0 = String(it.row[0] || "");
    if (/^[\u4e00-\u9fa5a-z0-9+\-²³⁴⁵⁶⁷⁸⁹⁰]+$/.test(tk) && tk.length >= 2) {

    var tkIon = tk.replace(/[+−－－]/g, "+").replace(/[⁻⁺]/g, function(cc){return cc==="⁺"?"+":"-";}).replace(/[-－]/g, "-").replace(/\s+/g, "");
    var fmCore = fmIon.replace(/\d/g, "").replace(/[+\-]/g, "");
    var tkCore = tkIon.replace(/\d/g, "").replace(/[+\-]/g, "");
    var fmSign = (fmIon.match(/[+\-]/) || [""])[0];
    var tkSign = (tkIon.match(/[+\-]/) || [""])[0];
    var fmNum = (fmIon.match(/\d+/) || [""])[0];
    var tkNum = (tkIon.match(/\d+/) || [""])[0];
    if (tkCore && fmCore && tkCore === fmCore && tkSign === fmSign && (!tkNum || !fmNum || tkNum === fmNum)) {
      sc = Math.max(sc, 9700000 + (10 - k) * 100);
    }
    // 仅离子核匹配：输入 Fe2 命中 Fe²⁺
    if (tkCore && fmCore && tkCore === fmCore && tkSign === fmSign && !tkNum) {
      sc = Math.max(sc, 9600000 + (10 - k) * 100);
    }

    // ③ 名称或化学式完全一致
    if (name === tk || fm === tk) sc = Math.max(sc, 9500000 + (10 - k) * 100);

    // ④ 化学式前缀匹配（fe2o 命中 fe2o3）
    if (tkDigits && fmDigits && fmDigits.indexOf(tkDigits) === 0) sc = Math.max(sc, 9300000 + (10 - k) * 100);

    // ⑤ 化学式片段命中（拆词索引）：输入 SO4 / MnO4 / CO3 / Na2CO3 / 单个元素符号
    for (var w = 0; w < it.chem.length; w++) {
      if (it.chem[w] === tk) { sc = Math.max(sc, 9100000 + (10 - k) * 100); break; }
    }

    // ⑥ 字母骨架完全一致（忽略数字与大小写）
    if (tkLetters && fmLetters && tkLetters === fmLetters) sc = Math.max(sc, 8900000 + (10 - k) * 100);

    // ⑦ 中文精确匹配：名称中包含查询词（或查询词包含在名称中）
    // 对于纯中文查询，做子串匹配
    var inName = cnSubstr(name, tk);
    var inFm = cnSubstr(fm, tk);
    var inRest = cnSubstr(rest, tk);
    
    // ⑦b 名称前缀匹配（查询词是名称的开头部分）

      }
      if (allIn && tk.length >= 2) {
        // 检查字符是否按顺序出现（允许间隔）
        var pos = 0;
        var ordered = true;
        for (var ci3 = 0; ci3 < tk.length; ci3++) {
          var found = false;
          for (var ci4 = pos; ci4 < name.length; ci4++) {
            if (name.charAt(ci4) === tk.charAt(ci3)) { pos = ci4 + 1; found = true; break; }
          }
          if (!found) { ordered = false; break; }
        }
        if (ordered) {
          // 按连续度给分：越连续分越高

            lpos = idx2;

    // ⑦c 中文子串在 rest 中的匹配
    if (!inRest && /^[\u4e00-\u9fa5]+$/.test(tk)) {
      // 查询词是 rest 的子串
      if (rest.indexOf(tk) >= 0) {
        sc = Math.max(sc, 7500000 + (10 - k) * 100);
        inRest = true;
      }
    }

    // ⑦d 化学式精确包含（如查询 "NaCl" 命中 "NaClO"）
    if (!inFm && tkDigits && fmDigits && fmDigits.indexOf(tkDigits) >= 0) {
      sc = Math.max(sc, 7000000 + (10 - k) * 100);
      inFm = true;
    }

    if (sc < 0) {
      if (inFm) sc = 7000;
      else if (inName) sc = 6000;
      else if (inRest) sc = 5000;

    } else {
      if (inFm) sc += 4000;
      else if (inName) sc += 3000;
      else if (inRest) sc += 2000;

        "2": /镁|钙|钡|锌|亚铁|铜|汞|铅|钴|镍|锡|镉|锰|铬|铁\(Ⅱ\)|FeO|CuO|HgO|PbO|CoO|NiO|SnO|CdO|MnO|FeS|MgO|BaO|SrO|RaO|ZnO|CaO|BeO/,
        "3": /铝|铁\(Ⅲ\)|Fe₂O₃|FeCl₃|铬\(Ⅲ\)|Cr₂O₃|金\(Ⅲ\)|钴\(Ⅲ\)|Co₂O₃|镓|铟|铊/,
        "4": /硅|锡|铅|钛|锰\(Ⅳ\)|MnO₂|碳\(Ⅳ\)|CO₂|硅酸|SiO₂|GeO₂|PbO₂|SnO₂|TiO₂|CeO₂|ZrO₂/,
        "5": /磷|氮\(Ⅴ\)|HNO₃|N₂O₅|砷|P₂O₅|Bi₂O₅|锑|钒\(Ⅴ\)/,
        "6": /硫|铬|锰|钨|铀|Mo|W|S\(Ⅵ\)|SO₃|CrO₃|MnO₃|WO₃|MoO₃|UF₆|CrO₄/,
        "7": /锰|氯|Mn\(Ⅶ\)|Mn₂O₇|Re₂O₇|碘|TC|锝/,
        "-1": /氟|氢负|NaH|CaH|LiH|KH|BaH|NaBH|LiAlH|KHF|CsH|卤化氢|HCl|HBr|HI/,
        "-2": /硫离子|S²|氧|S²⁻|氧化物|O²|Se²|Te²|H₂S|FeS|CuS|ZnS|BaS|Na₂S|K₂S/,
        "-3": /氮离子|N³|磷离子|P³|As³|氮化|Li₃N|Mg₃N₂|Ca₃N₂|AlN/
      };
      if (valMap[tk] && valMap[tk].test(vn + " " + vfm)) hit = true;
      if (!hit && (valHit(tk, vs) || valHit(tk, vt) || valHit(tk, vn))) hit = true;
      if (!hit) return -1;
      sc += 6000000;
    }

    if (sc > best) best = sc;
  }
  return best;
}

function doSearch(q) {
  var tokens = tokenize(q);
  if (tokens.length === 0) return [];
  var out = [];
  for (var i = 0; i < searchIndex.length; i++) {
    var sc = scoreItem(searchIndex[i], tokens);
    if (sc >= 0) out.push({ it: searchIndex[i], score: sc });
  }
  out.sort(function (a, b) { return b.score - a.score; });
  var seen = {};
  var uniq = [];
  for (var k = 0; k < out.length; k++) {
    var it = out[k].it;
    var key = (it.tab || "") + "|" + norm(it.row[1] || "") + "|" + norm(it.row[0] || "");
    if (seen[key]) continue;
    seen[key] = 1;
    uniq.push(it);
  }
  return uniq.slice(0, 200);
}

  }

  if ((mod.notes || []).length && !curQ && curCat === "all") {
    h += '<div class="notes"><div class="notes-h">易错点与记忆要点</div>' + (mod.notes || []).map(function (n) {
      return '<div class="note"><div class="note-t">' + esc(n[0]) + '</div><div class="note-d">' + n[1] + '</div></div>';
    }).join("") + '</div>';
  }

  el("view").innerHTML = h;
  bindRows();
  bindCats();
  el("count").textContent = (curQ ? "找到 " : "共 ") + el("view").querySelectorAll(".r").length + (curQ ? " 条匹配" : " 条") + " · 数据版本 " + VER;
}

function bindRows() {
  var rs = el("view").querySelectorAll(".r");
  for (var i = 0; i < rs.length; i++) {
    (function (node) {
      node.onclick = function () { openDetail(node.dataset.tab, parseInt(node.dataset.gi, 10), parseInt(node.dataset.idx, 10)); };
    })(rs[i]);
  }
}
function bindCats() {
  var cs = el("view").querySelectorAll(".cat");
  for (var i = 0; i < cs.length; i++) {
    (function (node) {
      node.onclick = function (e) { e.stopPropagation(); curCat = node.dataset.c; render(); };
    })(cs[i]);
  }
}

function openDetail(tab, gi, idx) {
  var mod = DATA[tab];
  if (!mod) return;
  var g = mod.groups[gi];
  if (!g) return;
  var r = g.rows[idx];
  if (!r) return;
  var h = '<div class="d-head"><div class="d-title">' + esc(r[0]) + '</div><button class="d-close" id="dClose">×</button></div><div class="d-body">';
  h += '<div class="d-kv">';
  if (r[1] != null && r[1] !== "") h += '<div class="dk">化学式</div><div class="dv">' + esc(r[1]) + '</div>';
  if (r[2] != null && r[2] !== "") h += '<div class="dk">说明</div><div class="dv">' + esc(r[2]) + '</div>';
  if (r[3] != null && r[3] !== "") h += '<div class="dk">易错点</div><div class="dv err">' + esc(r[3]) + '</div>';
  h += '</div>';
  var sibs = (g.rows || []).filter(function (x, i) { return i !== idx; });
  if (sibs.length) {
    h += '<div class="d-sib-h">同组对照（点击切换）</div><div class="d-sib">';
    for (var i = 0; i < sibs.length; i++) {
      var s = sibs[i];
      var ri = g.rows.indexOf(s);
      h += '<div class="d-sib-i" data-sibgi="' + gi + '" data-sibidx="' + ri + '" data-sibtab="' + esc(tab) +
        '">' + esc(s[0]) + (s[1] ? ' <span class="fm">' + esc(s[1]) + '</span>' : '') + '</div>';
    }
    h += '</div>';
  }
  h += '</div>';
  var d = el("detail");
  d.innerHTML = h;
  d.classList.add("show");
  detail = d;
  el("dClose").onclick = closeDetail;
  var sibItems = d.querySelectorAll(".d-sib-i");
  for (var j = 0; j < sibItems.length; j++) {
    (function (node) {
      node.onclick = function () {
        openDetail(node.dataset.sibtab, parseInt(node.dataset.sibgi, 10), parseInt(node.dataset.sibidx, 10));
      };
    })(sibItems[j]);
  }
}
function closeDetail() { detail = null; el("detail").classList.remove("show"); }

// ===== 事件 =====
var timer = null;
function onSearch(e) {
  curQ = (e.target.value || "").trim();
  el("clearBtn").style.display = curQ ? "flex" : "none";
  var bar = el("bar");
  if (bar) { bar.classList.add("show"); bar.querySelector("i").style.width = "0%"; }
  clearTimeout(timer);
  timer = setTimeout(function () {
    var bar2 = el("bar");
    if (bar2) { bar2.querySelector("i").style.width = "100%"; }
    render();
    setTimeout(function () { if (bar2) bar2.classList.remove("show"); }, 200);
  }, 90);
}

function init() {
  if (!indexBuilt) buildIndex();
  var tabs = el("tabs");
  tabs.innerHTML = TAB_ORDER.map(function (t) {
    return '<span class="tab' + (t === curTab ? " on" : "") + '" data-t="' + t + '">' + esc(TAB_NAME[t]) + '</span>';
  }).join("");
  tabs.onclick = function (e) {
    var t = e.target.dataset.t;
    if (!t) return;
    curTab = t;
    curCat = "all";
    curQ = "";
    el("q").value = "";
    el("clearBtn").style.display = "none";
    for (var i = 0; i < tabs.children.length; i++) {
      tabs.children[i].classList.toggle("on", tabs.children[i].dataset.t === curTab);
    }
    render();
  };
  el("q").oninput = onSearch;
  el("clearBtn").onclick = function () { el("q").value = ""; onSearch({ target: el("q") }); el("q").focus(); };
  el("detail").onclick = function (e) { if (e.target === el("detail") && e.target === el("detail")) closeDetail(); };
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeDetail();
    if (e.key === "/" && document.activeElement !== el("q")) { e.preventDefault(); el("q").focus(); }
  });
  el("cntAll").textContent = totalRows() + " 条数据";
  render();
  try { if (localStorage.getItem(KEY) !== VER) localStorage.setItem(KEY, VER); } catch (e) { }
  if (window.fetch) {
    fetch(location.href, { cache: "no-cache" }).then(function (r) { return r.text(); }).then(function (html) {
      var m = html.match(/var VER="([^"]+)"/);
      if (m && m[1] !== VER) {
        var note = el("updNote");
        note.style.display = "block";
        note.innerHTML = "<b>检测到新版本 " + esc(m[1]) + "</b>，请刷新页面获取更新（当前 " + esc(VER) + "）。";
      }
    }).catch(function () { });
  }
}
init();

</script>
</body>
</html>
